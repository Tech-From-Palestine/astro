# نشر واجهة React على GitHub Pages تلقائياً عند كل push على main
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/deploy-client.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # رابط الباك اند على Render — يُضبط من Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # مسار الموقع: /اسم-الريبو/ (أو / إذا كان الريبو username.github.io)
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "::error::أضف المتغير VITE_API_URL في إعدادات الريبو (Actions variables)"; exit 1; fi
          npm run build
          # GitHub Pages لا يدعم مسارات React مباشرة؛ 404.html يعيد تحميل التطبيق لأي رابط
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
